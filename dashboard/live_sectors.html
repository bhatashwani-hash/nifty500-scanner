<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F&O Live Sector Board</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;
--bg:#f3f5f8;--card:#fff;--bd:#e6eaf0;--tx:#1f2733;--mut:#8a94a6;
--up:#11875a;--upbg:#e9f7ef;--upbd:#bfe6cf;--dn:#d23a3a;--dnbg:#fdecec;--dnbd:#f3c9c9;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12px}
a{color:inherit;text-decoration:none}
/* index strip */
.idxwrap{background:var(--bg);padding:8px 10px 4px;overflow-x:auto}
.idxstrip{display:flex;gap:8px;min-width:max-content}
.idx{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;min-width:104px}
.idx .nm{font-size:9.5px;letter-spacing:.4px;color:var(--mut);font-weight:700;text-transform:uppercase;white-space:nowrap}
.idx .vl{font-size:14px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.idx .ch{font-size:11px;font-weight:600;margin-top:1px}
/* control bar */
.ctrl{position:sticky;top:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:6px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.livepill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--upbd);border-radius:20px;padding:4px 11px;font-weight:700;font-size:11px;color:var(--up);background:var(--upbg)}
.livepill .dot{width:7px;height:7px;border-radius:50%;background:#19b56b;box-shadow:0 0 0 3px rgba(25,181,107,.18);animation:pulse 1.6s infinite}
.livepill.off{color:var(--dn);border-color:var(--dnbd);background:var(--dnbg)}
.livepill.off .dot{background:#d23a3a;box-shadow:none;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.seg{display:inline-flex;background:#eef1f5;border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;font-size:11px;font-weight:600;color:var(--mut);padding:4px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.summary{font-size:11.5px;color:#5b6573}
.summary b{color:var(--tx)}
.adv{color:var(--up);font-weight:700}.dec{color:var(--dn);font-weight:700}
.grow{flex:1}
.ctrl input{font-size:12px;border:1px solid var(--bd);border-radius:7px;padding:5px 9px;width:120px}
.warnbar{display:none;background:var(--dnbg);color:var(--dn);border-bottom:1px solid var(--dnbd);padding:7px 12px;font-size:11.5px;font-weight:600}
.warnbar code{background:#fff;padding:1px 5px;border-radius:4px;border:1px solid var(--dnbd);font-weight:700}
/* board */
.board{padding:10px 12px 70px;column-width:248px;column-gap:12px}
.secM{display:inline-block;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:0 0 12px;break-inside:avoid;overflow:hidden;vertical-align:top}
.shead{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--bd);background:#fff}
.shead .nm{font-weight:700;font-size:12px;line-height:1.15}
.shead .badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px}
.badge.u{color:var(--up);background:var(--upbg);border:1px solid var(--upbd)}
.badge.d{color:var(--dn);background:var(--dnbg);border:1px solid var(--dnbd)}
.badge.z{color:var(--mut);background:#eef1f5}
.shead .cnt{margin-left:auto;color:#b4bcca;font-size:11px;font-weight:600}
.secM.tu .shead{background:linear-gradient(0deg,#fff,#f3fbf6)}
.secM.td .shead{background:linear-gradient(0deg,#fff,#fdf3f3)}
.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:4px 11px}
.row+.row{border-top:1px solid #f4f6f9}
.row:hover{background:#f8fafc}
.row .sym{font-weight:600;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ltp{text-align:right;color:#5b6573;font-variant-numeric:tabular-nums;font-size:11.5px}
.row .chg{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:11.5px;min-width:56px}
.row.fl-u{animation:flu .7s ease}
.row.fl-d{animation:fld .7s ease}
@keyframes flu{from{background:#d9f5e5}to{background:transparent}}
@keyframes fld{from{background:#fbdada}to{background:transparent}}
.u{color:var(--up)}.d{color:var(--dn)}.z{color:var(--mut)}
@media(max-width:520px){.board{column-width:100%}}
</style></head><body>

<div class="idxwrap"><div class="idxstrip" id="idx"></div></div>

<div class="ctrl">
  <span class="livepill" id="live"><span class="dot"></span><span id="livetxt">LIVE</span></span>
  <div class="seg" id="sortseg">
    <button data-s="chg" class="on">By %</button>
    <button data-s="az">A&ndash;Z</button>
  </div>
  <span class="summary" id="summary">connecting&hellip;</span>
  <span class="grow"></span>
  <input id="q" placeholder="Search...">
</div>
<div class="warnbar" id="warn"></div>

<div class="board" id="board"></div>

<script>
const SUPABASE_URL = "https://lgsgcccasccxfofxsbge.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxnc2djY2Nhc2NjeGZvZnhzYmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NTI5MjMsImV4cCI6MjA5NzUyODkyM30.mUk6etxWdkxttwoHnG9-F2axvj680XXOKWmjaSRYuTA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const IDX_NAMES={"^NSEI":"NIFTY 50","^NSEBANK":"BANK","NIFTY_FIN_SERVICE.NS":"FINNIFTY","^CNXIT":"IT","^CNXAUTO":"AUTO","^CNXPHARMA":"PHARMA","^CNXFMCG":"FMCG","^CNXMETAL":"METAL","^CNXENERGY":"ENERGY","^CNXREALTY":"REALTY","^CNXPSUBANK":"PSU BANK","^CRSLDX":"NIFTY 500","^NSMIDCP":"NEXT 50"};
const IDX_ORDER=["^NSEI","^NSEBANK","NIFTY_FIN_SERVICE.NS","^CNXIT","^CNXAUTO","^CNXPHARMA","^CNXFMCG","^CNXMETAL","^CNXENERGY","^CNXREALTY","^CNXPSUBANK","^CRSLDX","^NSMIDCP"];
const POLL_MS = 3000, STALE_SECS = 60;

let sectorOf = {};      // symbol -> sector
let sortMode = 'chg', query = '', prevChg = {};

const $=id=>document.getElementById(id);
const fmtP=v=>v==null?'&ndash;':(v>=0?'+':'')+Number(v).toFixed(2)+'%';
const fmtN=v=>v==null?'':Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=v=>v==null?'z':v>0.02?'u':v<-0.02?'d':'z';
function pad(n){return(n<10?'0':'')+n;}
function nowIST(){const u=Date.now()+(new Date().getTimezoneOffset()*60000)+5.5*3600000;return new Date(u);}
function mktTime(){const d=nowIST();let h=d.getHours(),ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+' '+ap;}

// one-time: symbol -> sector for the F&O universe
async function loadSectors(){
  const { data, error } = await sb.from("stocks")
    .select("symbol,sector").eq("is_active",true).eq("is_fno",true);
  if(error||!data){ return false; }
  sectorOf = {};
  data.forEach(r=>{ sectorOf[r.symbol] = r.sector || "Unknown"; });
  return true;
}

async function tick(){
  const { data, error } = await sb.from("ticks")
    .select("symbol,is_index,ltp,prev_close,chg_pct,updated_at");
  if(error){ setLive(false, "Supabase read failed: "+error.message); return; }
  render(data||[]);
}

function setLive(on, msg){
  const p=$('live'), w=$('warn');
  p.classList.toggle('off', !on);
  $('livetxt').textContent = on ? 'LIVE' : 'OFFLINE';
  if(msg){ w.style.display='block'; w.innerHTML = msg; } else { w.style.display='none'; }
}

function render(rows){
  // ---- staleness: is the streamer actually running?
  let newest = 0;
  rows.forEach(r=>{ const t=new Date(r.updated_at).getTime(); if(t>newest) newest=t; });
  const ageSec = rows.length ? Math.round((Date.now()-newest)/1000) : null;
  if(!rows.length){
    setLive(false, "&#9888; No rows in <code>ticks</code> — start the streamer: <code>python ingestion/kite_ticks.py</code>");
  } else if(ageSec > STALE_SECS){
    setLive(false, "&#9888; Data is stale ("+ageSec+"s old) — the streamer looks stopped. Run <code>python ingestion/kite_login.py</code> then <code>python ingestion/kite_ticks.py</code>");
  } else {
    setLive(true, null);
  }

  // ---- index strip
  const idxRows = rows.filter(r=>r.is_index);
  const byIdx = {}; idxRows.forEach(r=>byIdx[r.symbol]=r);
  $('idx').innerHTML = IDX_ORDER.filter(s=>byIdx[s]).map(s=>{
    const r=byIdx[s];
    return '<div class="idx"><div class="nm">'+(IDX_NAMES[s]||s)+'</div>'+
      '<div class="vl">'+fmtN(r.ltp)+'</div>'+
      '<div class="ch '+cls(r.chg_pct)+'">'+fmtP(r.chg_pct)+'</div></div>';
  }).join('') || '<div class="idx"><div class="nm">indices</div><div class="vl">&ndash;</div><div class="ch z">waiting</div></div>';

  // ---- group stocks by sector (from stocks.sector)
  const stocks = rows.filter(r=>!r.is_index && (!query || r.symbol.includes(query)));
  let adv=0, dec=0;
  rows.filter(r=>!r.is_index).forEach(r=>{ if(r.chg_pct>0)adv++; else if(r.chg_pct<0)dec++; });

  const groups = {};
  stocks.forEach(r=>{
    const sec = sectorOf[r.symbol] || "Unknown";
    (groups[sec] = groups[sec] || []).push(r);
  });

  // sector order: strongest average first
  const secNames = Object.keys(groups).sort((a,b)=>avgOf(groups[b])-avgOf(groups[a]));
  $('summary').innerHTML = '<b>'+rows.filter(r=>!r.is_index).length+'</b> F&amp;O &middot; <b>'+secNames.length+
    '</b> sectors &middot; <span class="adv">'+adv+' &#9650;</span> <span class="dec">'+dec+' &#9660;</span> &middot; '+
    mktTime()+(ageSec!=null?' &middot; tick '+ageSec+'s ago':'');

  let html='';
  for(const sec of secNames){
    let arr = groups[sec];
    if(sortMode==='az') arr.sort((a,b)=>a.symbol<b.symbol?-1:1);
    else arr.sort((a,b)=>(b.chg_pct??-1e9)-(a.chg_pct??-1e9));
    const avg = avgOf(arr);
    const tint = avg>0.02?' tu':avg<-0.02?' td':'';
    const body = arr.map(r=>{
      const p = prevChg[r.symbol];
      let fl='';
      if(p!=null && r.chg_pct!=null && Math.abs(r.chg_pct-p)>0.001) fl = r.chg_pct>p?' fl-u':' fl-d';
      prevChg[r.symbol]=r.chg_pct;
      return '<div class="row'+fl+'">'+
        '<span class="sym">'+r.symbol+'</span>'+
        '<span class="ltp">'+fmtN(r.ltp)+'</span>'+
        '<span class="chg '+cls(r.chg_pct)+'">'+fmtP(r.chg_pct)+'</span></div>';
    }).join('');
    html += '<div class="secM'+tint+'">'+
      '<div class="shead"><span class="nm">'+sec+'</span>'+
      '<span class="badge '+cls(avg)+'">'+fmtP(avg)+'</span>'+
      '<span class="cnt">'+arr.length+'</span></div>'+body+'</div>';
  }
  $('board').innerHTML = html || '<div style="padding:20px;color:var(--mut)">No stocks match.</div>';
}

function avgOf(arr){
  const v = arr.filter(r=>r.chg_pct!=null);
  return v.length ? v.reduce((s,r)=>s+Number(r.chg_pct),0)/v.length : 0;
}

$('q').addEventListener('input',e=>{ query=e.target.value.trim().toUpperCase(); });
$('sortseg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  sortMode=b.dataset.s;
  [...$('sortseg').children].forEach(x=>x.classList.toggle('on',x===b));
});

(async function start(){
  const ok = await loadSectors();
  if(!ok) setLive(false, "&#9888; Could not load the sector map from <code>stocks</code>.");
  tick();
  setInterval(tick, POLL_MS);       // safe: direct Supabase read, no permission prompts
  setInterval(loadSectors, 15*60*1000);
})();
</script>
</body></html>
