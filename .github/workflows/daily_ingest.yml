name: Daily Ingestion — Yahoo Finance → ohlcv (500 stocks)

# Runs at 4:00 PM IST (10:30 UTC) on NSE trading days (Mon–Fri).
# NSE closes at 3:30 PM IST; this fires 30 min after the close.
# Fetches ONLY that day's bar for the active 500-stock universe (stocks table)
# and upserts into the ohlcv table.
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Run a full 5-year backfill instead of the daily single-day load"
        required: false
        default: "false"
      days:
        description: "Daily mode lookback window in days (default 1 = that day only)"
        required: false
        default: "1"

jobs:
  ingest:
    name: Ingest Yahoo Finance OHLCV (500 stocks → ohlcv)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          DAYS="${{ github.event.inputs.days }}"
          DAYS="${DAYS:-1}"
          if [ "${{ github.event.inputs.full_backfill }}" = "true" ]; then
            echo "Full 5-year backfill (stocks → ohlcv)"
            python ingestion/fetch_data.py --mode backfill --years 5 --universe stocks 2>&1 | tee ingestion/daily_ingest.log
          else
            echo "Daily single-day ingest (last $DAYS day(s), 500 stocks → ohlcv)"
            python ingestion/fetch_data.py --mode daily --universe stocks --days "$DAYS" 2>&1 | tee ingestion/daily_ingest.log
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log-${{ github.run_id }}
          path: ingestion/daily_ingest.log
          retention-days: 7
