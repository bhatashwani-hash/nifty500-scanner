name: Live 15m — Yahoo intraday → live_15m

# Every 15 minutes during NSE market hours (≈9:15 AM–3:30 PM IST = 03:45–10:00 UTC),
# weekdays only. Pulls delayed 15-min bars for F&O stocks + indices into live_15m.
# Note: GitHub cron can be delayed a few minutes, so "live" is approximate.
on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch:

jobs:
  live:
    name: Fetch delayed 15-min quotes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Fetch live 15m (F&O stocks + indices)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingestion/fetch_live.py
